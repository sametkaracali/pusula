{% extends "admin/base.html" %}
{% block title %}E-posta Aboneleri{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-envelope"></i> E-posta Aboneleri</h2>

<div class="card bg-dark border-secondary">
    <div class="card-body p-0">
        <table class="table table-dark table-striped mb-0">
            <thead>
                <tr>
                    <th>E-posta</th>
                    <th>Kayıt Tarihi</th>
                </tr>
            </thead>
            <tbody>
                {% for sub in subscribers %}
                <tr>
                    <td>{{ sub.email }}</td>
                    <td>{{ sub.date }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="2" class="text-center text-white-50">Henüz abone yok.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<div class="mt-2">
    <small class="text-white-50">Toplam: {{ subscribers|length }} abone</small>
</div>
{% endblock %}
