{% extends "admin/base.html" %}
{% block title %}Ayarlar{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-gear"></i> Ayarlar</h2>

<form method="POST" class="row g-3">
    <div class="col-md-6">
        <label class="form-label text-white-50">Site Başlığı</label>
        <input type="text" name="site_title" class="form-control bg-dark text-white border-secondary" value="{{ site_title }}">
    </div>
    <div class="col-md-6">
        <label class="form-label text-white-50">Site Açıklaması</label>
        <input type="text" name="site_description" class="form-control bg-dark text-white border-secondary" value="{{ site_description }}">
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Kaydet</button>
    </div>
</form>
{% endblock %}
